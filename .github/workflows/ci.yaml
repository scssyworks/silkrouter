name: CI

on:
  push:
    branches:
      - 'v*'
      - 'release/v*'
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  SUPPORTED_MAJORS: '6 5 4'
  LATEST_MAJOR: '6'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        run: npm run deploy

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist

      - name: Determine version and tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/v* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"

            if [[ ! "$BRANCH" =~ ^v[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version branch: $BRANCH"
              exit 1
            fi

            VERSION_LINE="${BRANCH#v}"

            VERSION="${VERSION_LINE}.0-canary.${GITHUB_SHA::6}"
            TAG="canary-${VERSION_LINE}"
            MAJOR="${VERSION_LINE%%.*}"

          elif [[ "${GITHUB_REF}" == refs/heads/release/v* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"

            if [[ ! "$BRANCH" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version branch: $BRANCH"
              exit 1
            fi

            BASE_VERSION="${BRANCH#release/v}"

            RC_NUMBER=$(node scripts/release.js "${BASE_VERSION}")

            if [[ -z "$RC_NUMBER" || ! "$RC_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "Invalid RC number: $RC_NUMBER"
              exit 1
            fi

            VERSION="${BASE_VERSION}-rc.${RC_NUMBER}"
            TAG="rc-${BASE_VERSION}"
            MAJOR="${BASE_VERSION%%.*}"
            
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            GITHUB_TAG="${GITHUB_REF#refs/tags/}"

            if [[ ! "$GITHUB_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version tag: $GITHUB_TAG"
              exit 1
            fi

            VERSION="${GITHUB_TAG#v}"
            TAG="v${VERSION}"
            MAJOR="${VERSION%%.*}"

          else
            echo "Unsupported ref: ${GITHUB_REF}"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Validate release policy
        run: |
          MAJOR="${{ steps.vars.outputs.major }}"

          ALLOWED=false
          for SUPPORTED in $SUPPORTED_MAJORS; do
            if [[ "$MAJOR" == "$SUPPORTED" ]]; then
              ALLOWED=true
              break
            fi
          done

          if [[ "$ALLOWED" == "false" ]]; then
            echo "Unsupported major version: $MAJOR"
            exit 1
          fi

      - name: Update package.json version
        run: |
          npm version "${{ steps.vars.outputs.version }}" --no-git-tag-version

      - name: Publish to npm
        run: |
          npm publish --tag "${{ steps.vars.outputs.tag }}" --access public

      - name: Promote stable release to latest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          MAJOR="${{ steps.vars.outputs.major }}"
          VERSION="${{ steps.vars.outputs.version }}"

          if [[ "$MAJOR" == "$LATEST_MAJOR" ]]; then
            PACKAGE_NAME=$(node -p "require('./package.json').name")
            npm dist-tag add "${PACKAGE_NAME}@${VERSION}" latest
            echo "Promoted ${PACKAGE_NAME}@${VERSION} to latest"
          else
            echo "Not promoting to latest since major version $MAJOR is not the latest supported major version ($LATEST_MAJOR)"
          fi

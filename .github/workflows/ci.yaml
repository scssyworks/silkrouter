name: CI

on:
  push:
    branches:
      - 'v*'
      - 'release/*'
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          package-manager-cache: false

      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          package-manager-cache: false

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: dist
          path: dist

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: dist
          path: dist

      - name: Determine version
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/v* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            VERSION_LINE="${BRANCH#v}"
            VERSION="0.0.0-${VERSION_LINE}-${GITHUB_SHA::6}"
            TAG="canary-${VERSION_LINE}"
          elif [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            BASE_VERSION="${BRANCH#release/}"
            VERSION="${BASE_VERSION}-rc.${GITHUB_RUN_NUMBER}"
            TAG="rc-${BASE_VERSION}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG="latest"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          npm version ${{ steps.vars.outputs.version }} --no-git-tag-version

      - name: Publish to npm
        run: |
          npm publish --tag ${{ steps.vars.outputs.tag }} --access public

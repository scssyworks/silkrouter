name: CI

on:
  push:
    branches:
      - 'v*'
      - 'release/*'
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dist
          path: dist

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: dist
          path: dist

      - name: Determine version
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/v* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            VERSION_LINE="${BRANCH#v}"
            VERSION="0.0.0-${VERSION_LINE}-${GITHUB_SHA::6}"
            TAG="canary-${VERSION_LINE}"
          elif [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            BASE_VERSION="${BRANCH#release/}"
            VERSION="${BASE_VERSION}-rc.${GITHUB_RUN_NUMBER}"
            TAG="rc-${BASE_VERSION}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG="latest"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          npm version ${{ steps.vars.outputs.version }} --no-git-tag-version

      - name: Publish to npm
        run: |
          npm publish --tag ${{ steps.vars.outputs.tag }} --access public
